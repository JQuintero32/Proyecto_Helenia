<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capítulo 3 - Escena 11</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Librerías -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
  
  <!-- Fuente Lobster Two -->
  <link href="https://fonts.googleapis.com/css2?family=Lobster+Two&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Lienzo principal responsivo -->
  <div class="screen-container">

    <!-- Escenario Bosque de Ébano -->
    <div id="escenario-bosque" class="escenario">
      <img src="Imag/bosque_ebano.svg" alt="Bosque de Ébano">
      <div id="animacion-helena-bosque"></div>
      <div id="animacion-naturaleza-magica"></div>
    </div>

    <!-- Botón SVG centrado -->
    <div id="boton" class="boton">
      <img src="boton.svg" alt="Botón iniciar">
    </div>

    <!-- Subtítulos narradora / diálogos -->
    <div id="subtitulos" class="subtitulos"></div>

  </div>

  <script>
    const bosque = document.getElementById("escenario-bosque");
    const boton = document.getElementById("boton");
    const subtitulos = document.getElementById("subtitulos");

    // Audios para la Escena 11
    const narradoraEscena11 = new Howl({ src: ['Audios/narradora_escena11.mp3'], volume: 2 });
    const helenaCantoBosque = new Howl({ src: ['Audios/helena_canto_suave_bosque.mp3'], volume: 1 });
    const narradoraVO11 = new Howl({ src: ['Audios/narradora_voz_en_off_11.mp3'], volume: 2 });

    // Configuración estándar Lottie
    const lottieSettings = {
      renderer: 'svg',
      rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
    };

    // Animaciones Lottie
    const animacionHelenaBosque = lottie.loadAnimation({
      ...lottieSettings,
      container: document.getElementById("animacion-helena-bosque"),
      loop: true,
      autoplay: false,
      path: 'Json/helena_bosque_ebano.json'
    });

    const animacionNaturalezaMagica = lottie.loadAnimation({
      ...lottieSettings,
      container: document.getElementById("animacion-naturaleza-magica"),
      loop: true,
      autoplay: false,
      path: 'Json/naturaleza_magica_rosas.json'
    });

    // Función para mostrar subtítulos
    function mostrarSubtitulo(texto, audio) {
      subtitulos.innerText = texto;
      subtitulos.style.opacity = "1";
      audio.play();
      audio.on('end', () => {
        subtitulos.style.opacity = "0";
      });
    }

    // Secuencia al hacer clic en el botón de inicio
    boton.addEventListener("click", () => {
      boton.style.display = "none";
      
      // Arrancar animaciones
      animacionHelenaBosque.play();
      animacionNaturalezaMagica.play();

      // 1. Segmento Narrativo (0s)
      mostrarSubtitulo(
        "Helena encuentra refugio en el Bosque de Ébano. Su canto despierta a la naturaleza: rosas que cantan y enredaderas que susurran, como si compartieran su voz.",
        narradoraEscena11
      );

      // 2. Canto suave de Helena y despertar de la naturaleza (a los 11 segundos)
      setTimeout(() => {
        helenaCantoBosque.play();
      }, 11000);

      // 3. Diálogo / Voz en Off final (a los 23 segundos)
      setTimeout(() => {
        mostrarSubtitulo("NARRADOR (V.O.):\n\n\"En el silencio de la tierra, su canto despertó nuevas voces.\"", narradoraVO11);
      }, 23000);
    });
  </script>
</body>
</html>
