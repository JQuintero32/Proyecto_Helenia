<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capítulo 1 - Escena 5</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Librerías -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
  
  <!-- Fuente Lobster Two -->
  <link href="https://fonts.googleapis.com/css2?family=Lobster+Two&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Lienzo principal responsivo -->
  <div class="screen-container">

    <!-- Escenario Feria Campesina -->
    <div id="escenario-feria" class="escenario">
      <img src="Imag/feria_campesina.svg" alt="Feria Campesina">
      <div id="animacion-helena-feria"></div>
      <div id="animacion-conde"></div>
    </div>

    <!-- Botón SVG centrado -->
    <div id="boton" class="boton">
      <img src="boton.svg" alt="Botón iniciar">
    </div>

    <!-- Subtítulos narradora / diálogos -->
    <div id="subtitulos" class="subtitulos"></div>

  </div>

  <script>
    const feria = document.getElementById("escenario-feria");
    const boton = document.getElementById("boton");
    const subtitulos = document.getElementById("subtitulos");

    // Audios para la Escena 5
    const ambienteFeria = new Howl({ src: ['Audios/ambiente_feria_campesina.mp3'], loop: true, volume: 0.15 });
    const narradoraEscena5 = new Howl({ src: ['Audios/narradora_escena5.mp3'], volume: 2 });
    const aplausosMultitud = new Howl({ src: ['Audios/aplausos_feria.mp3'], volume: 0.8 });
    const dialogoCondeHelena = new Howl({ src: ['Audios/dialogo_conde_helena.mp3'], volume: 1 });

    // Configuración estándar Lottie
    const lottieSettings = {
      renderer: 'svg',
      rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
    };

    // Animaciones Lottie
    const animacionHelenaFeria = lottie.loadAnimation({
      ...lottieSettings,
      container: document.getElementById("animacion-helena-feria"),
      loop: true,
      autoplay: false,
      path: 'Json/helena_feria.json'
    });

    const animacionConde = lottie.loadAnimation({
      ...lottieSettings,
      container: document.getElementById("animacion-conde"),
      loop: true,
      autoplay: false,
      path: 'Json/conde_melodico.json'
    });

    // Función para mostrar subtítulos
    function mostrarSubtitulo(texto, audio) {
      subtitulos.innerText = texto;
      subtitulos.style.opacity = "1";
      audio.play();
      audio.on('end', () => {
        subtitulos.style.opacity = "0";
      });
    }

    // Secuencia al hacer clic en el botón de inicio
    boton.addEventListener("click", () => {
      boton.style.display = "none";
      
      // Iniciar ambiente de música folclórica
      ambienteFeria.play();

      // Arrancar animaciones Lottie
      animacionHelenaFeria.play();
      animacionConde.play();

      // 1. Narradora: Descripción inicial (0s)
      mostrarSubtitulo(
        "En una feria, Helena canta con fuerza. El Conde Melódico la observa fascinado, y la invita a cantar en un teatro para que su voz rompa los estigmas.",
        narradoraEscena5
      );

      // 2. Aplausos de la gente al cantar Helena (a los 7 segundos)
      setTimeout(() => {
        aplausosMultitud.play();
      }, 7000);

      // 3. Diálogos completos entre el Conde y Helena (a los 13 segundos)
      setTimeout(() => {
        mostrarSubtitulo("CONDE: \"Tu voz no pertenece a este lugar. Ven conmigo al Teatro de las Mil Estrellas.\"\nHELENA: \"¿Y si me rechazan?\"\nCONDE: \"Entonces, con tu canto, podrás abrirte paso a otros caminos.\"", dialogoCondeHelena);
      }, 13000);
    });
  </script>
</body>
</html>
