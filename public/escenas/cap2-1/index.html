<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulo 2 - Escena 6</title>
    <link rel="stylesheet" href="Style.css">
    
    <!-- Librerías Howler.js y Lottie Web -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js" 
            integrity="sha512-uOtp2vx2X/5+tLBEf5UoQyqwAkFZJBM5XwGa7BfXDnWR+wdpRvlSVzaIVcRe3tGNsStu6UMDCeXKEnr4IBT8gA==" 
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <!-- Fuente Lobster Two -->
    <link href="https://fonts.googleapis.com/css2?family=Lobster+Two&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Audios de la escena con Howler.js -->
    <!-- (Nota: Puedes ajustar o cambiar las rutas según tus archivos reales en la carpeta Audio) -->
    
    <div class="screen-container">
        <!-- Fondo del escenario -->
        <div class="lottie-bg-container" id="escenario-fondo"></div>

        <!-- Capas visuales de la escena -->
        <div id="publico-bueno"></div>
        <div id="publico-malo"></div>
        <div id="helena"></div>
        <div id="notas-musicales"></div>
        <div id="telon"></div>

        <!-- Botón Central Único Activador -->
        <img id="activador-telon" src="../boton.svg" alt="Activar Secuencia">

        <!-- Caja de subtítulos dinámicos -->
        <div id="subtitulos" class="subtitulos"></div>
    </div>

    <script>
        // Configuración de audios con Howler.js
        const narradoraEscena6 = new Howl({ src: ['Audio/narradora_escena6.mp3'], volume: 2 });
        const audioHelena = new Howl({ src: ['Audio/Sueño_sin_amor.mp3'], volume: 1 });
        const audioBueno = new Howl({ src: ['Audio/aplausos.mp3'], volume: 0.8 });
        const narradoraCierre = new Howl({ src: ['Audio/narradora_cierre_teatro.mp3'], volume: 2 });

        // Carga de animaciones Lottie
        const telonAnimado = lottie.loadAnimation({
            container: document.getElementById("telon"),
            renderer: 'svg', loop: false, autoplay: false,
            path: 'Json/telon.json'
        });

        const helenaAnimada = lottie.loadAnimation({
            container: document.getElementById("helena"),
            renderer: 'svg', loop: true, autoplay: false,
            path: 'Json/helena.json'
        });

        const notasAnimadas = lottie.loadAnimation({
            container: document.getElementById("notas-musicales"),
            renderer: 'svg', loop: true, autoplay: false,
            path: 'Json/notas.json'
        });

        const buenoAnimado = lottie.loadAnimation({
            container: document.getElementById("publico-bueno"),
            renderer: 'svg', loop: false, autoplay: false,
            path: 'Json/publico-bueno.json'
        });

        const maloAnimado = lottie.loadAnimation({
            container: document.getElementById("publico-malo"),
            renderer: 'svg', loop: false, autoplay: false,
            path: 'Json/publico-malo.json'
        });

        const subtitulos = document.getElementById("subtitulos");

        // Función para mostrar subtítulos sincronizados con el audio
        function mostrarSubtitulo(texto, audio) {
            subtitulos.innerText = texto;
            subtitulos.style.opacity = "1";
            audio.play();
            audio.on('end', () => {
                subtitulos.style.opacity = "0";
            });
        }

        // Secuencia automatizada al hacer clic en el botón central único
        document.getElementById("activador-telon").addEventListener("click", () => {
            // Ocultar y desactivar el botón
            document.getElementById("activador-telon").classList.add("ocultar-boton");

            // 1. Iniciar subtítulo y narración inicial (0s)
            mostrarSubtitulo(
                "Helena, ahora conocida como \"La Ronca de Oro\", canta con su voz grave en el Teatro de las Mil Estrellas. Su destino como artista comienza.",
                narradoraEscena6
            );

            // 2. Levantar el telón (a los 2 segundos)
            setTimeout(() => {
                telonAnimado.stop();
                telonAnimado.play();
            }, 2000);

            // 3. Helena comienza a cantar y aparecen las notas musicales (a los 8 segundos)
            setTimeout(() => {
                audioHelena.play();
                helenaAnimada.stop();
                helenaAnimada.play();
                document.getElementById("notas-musicales").classList.add("mostrar-notas");
                notasAnimadas.stop();
                notasAnimadas.play();
            }, 8000);

            // 4. Reacción entusiasta del público con aplausos (a los 22 segundos)
            setTimeout(() => {
                audioBueno.play();
                buenoAnimado.stop();
                buenoAnimado.play();
            }, 22000);

            // 5. Frase final de la narradora (V.O.) y cierre (a los 32 segundos)
            setTimeout(() => {
                mostrarSubtitulo("NARRADOR: \"Así nació una voz destinada a desafiar al mundo.\"", narradoraCierre);
            }, 32000);
        });
    </script>

    <!-- Script receptor de control de audio global -->
    <script>
      window.addEventListener('message', function(event) {
        if (event.data && event.data.tipo === 'CONTROL_AUDIO') {
          const debeSilenciar = event.data.isMuted;
          const elementosAudio = document.querySelectorAll('audio, video');
          elementosAudio.forEach(function(medio) {
            medio.muted = debeSilenciar;
          });
          // Control auxiliar para Howler si fuera necesario
          if (typeof Howler !== 'undefined') {
            Howler.mute(debeSilenciar);
          }
        }
      });
    </script>
</body>
</html>
